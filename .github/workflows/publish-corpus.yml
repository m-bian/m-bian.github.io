# Publishes the DE/DEI Corpus page at https://mingyangbian.com/corpus/
# This file lives in the website repository (m-bian/m-bian.github.io) at .github/workflows/publish-corpus.yml;
# a copy is kept in m-bian/de-dei-corpus under deploy/ for reference.
#
# Every 15 minutes it checks whether the private corpus repository has new commits. If it does, it builds
# the page and the public snapshot (corpus.json) with scripts/build.mjs and commits them to corpus/ here.
# The website repository is public, so these runs cost no Actions minutes.
#
# Needs one secret in the website repository: CORPUS_DEPLOY_KEY, the private half of a read-only deploy key
# on m-bian/de-dei-corpus (see the corpus README, "One-time setup"). Without it the workflow does nothing.
name: Publish DE/DEI corpus

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-corpus
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: Check the corpus repository for new commits
        id: check
        env:
          DEPLOY_KEY: ${{ secrets.CORPUS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::CORPUS_DEPLOY_KEY is not set yet, so there is nothing to publish."
            echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/corpus_key && chmod 600 ~/.ssh/corpus_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          head=$(GIT_SSH_COMMAND="ssh -i ~/.ssh/corpus_key -o IdentitiesOnly=yes" git ls-remote git@github.com:m-bian/de-dei-corpus.git refs/heads/main | cut -f1)
          if [ -z "$head" ]; then echo "::error::Could not read m-bian/de-dei-corpus. Check the deploy key."; exit 1; fi
          live=$(cat site/corpus/VERSION 2>/dev/null || true)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" = "$live" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Already published ${head:0:7}."; echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.go == '1'
        with:
          repository: m-bian/de-dei-corpus
          ssh-key: ${{ secrets.CORPUS_DEPLOY_KEY }}
          path: corpus
          persist-credentials: false

      - name: Build the page and the public snapshot
        if: steps.check.outputs.go == '1'
        run: node corpus/scripts/build.mjs --out site/corpus

      - name: Commit and push
        id: push
        if: steps.check.outputs.go == '1'
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A corpus
          if git diff --cached --quiet; then echo "Nothing changed."; echo "pushed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "Publish DE/DEI corpus ($(cut -c1-7 corpus/VERSION))"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to rebuild
        if: steps.push.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || echo "::notice::Pages will rebuild from the push."
