<style>
/* Layout: library-style browser — fixed masthead; below it one scrolling column: facet rows (Browse), labeled diachronic chart, sticky results bar, entry table; vermilion-marked detail drawer at right */
:root{
  --bg:#EDF1EF; --surface:#FAFBFA; --surface-2:#E3E9E6; --line:#C9D3CF; --line-soft:#DCE3E0;
  --ink:#141D1A; --ink-2:#44514D; --ink-3:#6B7974;
  --zhu:#BF3A1F; --zhu-ink:#FFFFFF; --zhu-soft:#F5DED6; --mark:#F1E3A2; --hl:#FBEBC8; --hl-bar:#C27D12; --na:#A3AEAA;
  --c1:#3953A4; --c2:#B07A1F; --c3:#237F72; --c4:#8A4C9E; --c5:#557F2E; --c6:#5F6F86; --c7:#B4527F; --c8:#84663F;
  --shadow:0 14px 36px rgba(20,29,26,.18),0 2px 6px rgba(20,29,26,.08);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --f-zh:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111816; --surface:#171F1C; --surface-2:#212B28; --line:#34413C; --line-soft:#27312E;
    --ink:#E2E9E6; --ink-2:#A8B5B0; --ink-3:#83918B;
    --zhu:#EE6A4C; --zhu-ink:#1B0D08; --zhu-soft:#3B231C; --mark:#4D4420; --hl:#3A2D16; --hl-bar:#E3A647; --na:#5E6B66;
    --c1:#8EA6F0; --c2:#E0B460; --c3:#6CCBB9; --c4:#C79BDB; --c5:#A3CC78; --c6:#A6B4C9; --c7:#EE98BE; --c8:#CFAE84;
    --shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#171F1C; --surface-2:#212B28; --line:#34413C; --line-soft:#27312E;
  --ink:#E2E9E6; --ink-2:#A8B5B0; --ink-3:#83918B;
  --zhu:#EE6A4C; --zhu-ink:#1B0D08; --zhu-soft:#3B231C; --mark:#4D4420; --hl:#3A2D16; --hl-bar:#E3A647; --na:#5E6B66;
  --c1:#8EA6F0; --c2:#E0B460; --c3:#6CCBB9; --c4:#C79BDB; --c5:#A3CC78; --c6:#A6B4C9; --c7:#EE98BE; --c8:#CFAE84;
  --shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.eyebrow{font:600 11px/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.hint{font-size:12px;color:var(--ink-3)}
.dim{color:var(--ink-3)}

/* masthead */
.topbar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.seal{flex:0 0 auto;width:36px;height:36px;display:grid;place-items:center;background:var(--zhu);color:var(--zhu-ink);font:600 13px/1 var(--f-mono);letter-spacing:.04em;border-radius:3px;box-shadow:inset 0 0 0 2.5px var(--zhu),inset 0 0 0 3.5px var(--zhu-ink)}
.brand h1{margin:0;font:600 16px/1.2 var(--f-ui);letter-spacing:.01em}
.brand .sub{font:11.5px/1.3 var(--f-mono);color:var(--ink-3)}
.search{flex:1 1 300px;max-width:560px;min-width:0;display:flex;align-items:center;gap:6px;height:36px;padding:0 5px 0 10px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--ink-3)}
.search:focus-within{border-color:var(--ink-2);color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink);height:100%}
.search input::placeholder{color:var(--ink-3)}
.search.bad{border-color:var(--zhu)}
.rx{height:26px;padding:0 8px;border-radius:5px;border:1px solid transparent;background:transparent;font:500 12px var(--f-mono);color:var(--ink-3)}
.rx[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.btn{height:32px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px/1 var(--f-ui);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover:not(:disabled){background:var(--ink-2);border-color:var(--ink-2)}
.btn.zhu{background:var(--zhu);border-color:var(--zhu);color:var(--zhu-ink)}
.btn.zhu:hover:not(:disabled){background:var(--zhu);filter:brightness(1.08)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--zhu);border-color:color-mix(in srgb,var(--zhu) 45%,var(--line))}
.linkbtn{border:0;background:transparent;padding:2px 4px;color:var(--ink-2);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.linkbtn:hover:not(:disabled){color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s}
.switch .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:var(--surface);transition:transform .15s}
.switch input:checked + .sw{background:var(--zhu)}
.switch input:checked + .sw::after{transform:translateX(12px)}
.switch input:focus-visible + .sw{outline:2px solid var(--zhu);outline-offset:2px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:250px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:5px;font-size:13px;display:flex;justify-content:space-between;gap:12px}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--line-soft);margin:4px 2px}
.menu .k{font:12px var(--f-mono);color:var(--ink-3)}
.menu a{color:inherit;text-decoration:none;padding:8px 10px;border-radius:5px;font-size:13px;display:flex;justify-content:space-between;gap:12px}
.menu a:hover{background:var(--surface-2)}
.menu .who{padding:8px 10px 6px;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.menu .who b{color:var(--ink);font-weight:600}
.menu .who .ok{color:var(--c3)}
.menu .who .ro{color:var(--ink-3)}
#bAuth{max-width:200px;overflow:hidden;text-overflow:ellipsis}
#bAuth:not(.signed){border-style:dashed}
.saving{font-size:12px;color:var(--ink-3);white-space:nowrap}
.hl-only .hl-n{font:12px var(--f-mono);color:var(--ink-3)}
.hl-only:has(input:checked){color:var(--ink)}
.hl-tag{color:var(--hl-bar);font-weight:500}
.btn.hlb{height:26px;padding:0 9px;font-size:12px}
.btn.hlb[aria-pressed="true"]{background:var(--hl);border-color:var(--hl-bar);color:var(--ink)}
.sheet.narrow{width:min(540px,100%)}
#authBody p{margin:0;line-height:1.55}
details.auth-alt summary{cursor:pointer;font-size:12.5px;color:var(--ink-2)}
details.auth-alt .muted{margin:8px 0 0}
.auth-pat{display:flex;gap:8px;margin-top:8px}
.auth-pat input{flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:13px var(--f-mono)}
.auth-err{margin:0 0 12px;padding:10px 12px;border-left:3px solid var(--zhu);background:var(--zhu-soft);border-radius:4px;font-size:13px;line-height:1.55;color:var(--ink)}
.auth-err b{font-weight:600}
.auth-err code,ol.auth-steps code{font:12px var(--f-mono)}
ol.auth-steps{margin:0 0 4px;padding-left:20px;font-size:13px;line-height:1.6}
ol.auth-steps li+li{margin-top:6px}
.auth-when{margin-top:10px!important;font-size:12px;color:var(--ink-3)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg2 button{border:0;background:transparent;height:28px;padding:0 11px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg2 button + button{border-left:1px solid var(--line)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--zhu)}

/* scrolling column */
.main{flex:1;min-height:0;display:flex;position:relative}
.scroller{flex:1;min-width:0;overflow:auto;background:var(--surface)}
.inner{width:max-content;min-width:100%}
.pin{position:sticky;left:0;width:var(--sw,100vw)}

/* browse */
.browse{background:var(--surface);padding-block:14px 12px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.br-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:4px}
.regsel{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.br-head .hint{flex:1 1 260px;min-width:0}
.frow{display:flex;align-items:flex-start;gap:4px 12px}
.flabel{flex:0 0 132px;padding-top:6px;font:600 12.5px/1.3 var(--f-ui);color:var(--ink-2)}
.fopts{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:3px 2px}
.fo{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:0;border-radius:5px;background:transparent;color:var(--ink);font-size:13px;white-space:nowrap}
.fo:hover{background:var(--surface-2)}
.fo .fc{font:11px/1 var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.fo.on{background:var(--zhu);color:var(--zhu-ink)}
.fo.on .fc{color:inherit;opacity:.85}
.fo.all.on{background:var(--ink);color:var(--surface)}
.fo.zero{color:var(--ink-3)}
.fo.zero .fc{opacity:.6}
.fo.un{font-style:italic}
.frow.more{margin-top:2px}
.frow.more .fopts{gap:6px 10px}
.frow.sub .flabel{color:var(--ink-3);font-weight:500}

/* chart */
.strip{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px 8px}
.strip-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.strip-head label{font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.strip-head select{height:28px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0 6px;font-size:12.5px}
.strip-head .sp{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.strip-body{display:flex;gap:4px;overflow-x:auto;padding-top:8px;padding-bottom:4px;scrollbar-width:thin}
.strip.closed .strip-body,.strip.closed .legend{display:none}
.pcol{flex:0 0 auto;width:136px;display:flex;flex-direction:column;gap:5px;padding:6px 6px 5px;border:0;border-radius:6px;background:transparent;color:var(--ink);text-align:left}
.pcol:hover{background:var(--bg)}
.pn{display:block;font:11px/1.2 var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.pplot{position:relative;display:block;width:100%;border-bottom:1px solid var(--ink-3)}
.pseg{position:absolute;left:0;width:20px;box-shadow:inset 0 1px 0 var(--surface)}
.lead{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lead path{fill:none;stroke:var(--ink-3);stroke-width:.8}
.plb{position:absolute;left:31px;height:14px;display:flex;align-items:center;gap:4px;font:10.5px/14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.plb i{width:7px;height:7px;border-radius:1.5px;flex:0 0 auto}
.pnone{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--ink-3)}
.plab{display:block;font:500 12px/1.2 var(--f-mono);color:var(--ink-2)}
.pcol.on{background:var(--zhu-soft)}
.pcol.on .plab{color:var(--zhu);font-weight:600}
.strip.has-sel .pcol:not(.on){opacity:.45}

/* results bar */
.toolbar{top:0;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.tabs button{border:0;background:transparent;height:28px;padding:0 14px;font-size:13px;font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.chips{flex:1 1 240px;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:26px;padding:0 3px 0 10px;border-radius:13px;background:var(--zhu-soft);border:1px solid color-mix(in srgb,var(--zhu) 28%,transparent);font-size:12px;color:var(--ink)}
.fchip .fl{color:var(--ink-2)}
.fchip .fv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.fchip button{flex:0 0 auto;width:20px;height:20px;border-radius:10px;border:0;background:transparent;color:var(--ink-2);line-height:1}
.fchip button:hover{background:color-mix(in srgb,var(--zhu) 18%,transparent);color:var(--ink)}
.tb-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.count{font:12px var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px;background:color-mix(in srgb,var(--mark) 55%,var(--surface));border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink)}
.banner b{font-weight:600}
.banner .btn{margin-left:auto}

/* table */
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.grid th{position:sticky;top:var(--tbh,45px);z-index:2;background:var(--surface-2);border-bottom:1px solid var(--line);padding:0;text-align:left;white-space:nowrap;font:600 12px/1.2 var(--f-ui);color:var(--ink-2)}
.th-btn{display:flex;align-items:center;gap:6px;width:100%;padding:9px 10px;border:0;background:transparent;color:inherit;font:inherit;text-align:left}
.th-btn:hover{color:var(--ink);background:color-mix(in srgb,var(--line) 45%,transparent)}
.th-btn .so{font:12px var(--f-mono);color:var(--ink-3);opacity:.6}
th[aria-sort="ascending"] .so,th[aria-sort="descending"] .so{color:var(--zhu);opacity:1}
.grid td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:13px;white-space:nowrap}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.grid tr.is-hl td{background:var(--hl)}
.grid tr.is-hl td:first-child{box-shadow:inset 3px 0 0 var(--hl-bar)}
.grid tbody tr.is-hl:hover td{background:color-mix(in srgb,var(--hl-bar) 22%,var(--surface))}
.grid tr.is-sel td{background:color-mix(in srgb,var(--c1) 9%,transparent)}
.grid tr.is-hl.is-sel td{background:color-mix(in srgb,var(--c1) 10%,var(--hl))}
.grid tr.is-open td{background:var(--zhu-soft)}
.grid tr.is-open td:first-child{box-shadow:inset 3px 0 0 var(--zhu)}
.c-sel{width:34px;padding-right:0!important}
.c-sel input{accent-color:var(--zhu);margin:3px 0 0}
th.c-n,td.c-n{width:40px;text-align:right;font:11px/1.9 var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
th.c-n{padding:9px 10px}
td.c-text{white-space:normal;min-width:300px;max-width:500px}
.zh{font:16px/1.65 var(--f-zh);color:var(--ink);word-break:break-all}
.de{color:var(--zhu);font-weight:600}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.tr{margin-top:5px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.tr.solo{margin-top:0;font-size:14.5px;line-height:1.55;color:var(--ink)}
.tr.none{font-size:12.5px;font-style:italic;color:var(--ink-3)}
td.c-long{white-space:normal;min-width:180px;max-width:260px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.45;color:var(--ink-2)}
td.c-short{max-width:200px;overflow:hidden;text-overflow:ellipsis}
.per{font:500 12px var(--f-mono);color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c);flex:0 0 auto}
.sbadge{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;font:500 10px/16px var(--f-ui);background:var(--mark);color:var(--ink-2);vertical-align:2px}
.sentinel{padding:14px;text-align:center;font-size:12px;color:var(--ink-3)}
.empty{max-width:520px;margin:56px auto;padding:0 20px;text-align:center;color:var(--ink-2)}
.empty .seal{margin:0 auto 14px;width:44px;height:44px;font-size:15px}
.empty h2{font:600 16px/1.3 var(--f-ui);margin:0 0 6px;color:var(--ink)}
.empty p{margin:0 0 14px;font-size:13px}

/* drawer */
.drawer{flex:0 0 min(470px,46vw);min-width:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);min-height:0}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px 9px 18px;border-bottom:1px solid var(--line-soft)}
.dr-pos{font:12px var(--f-mono);color:var(--ink-3)}
.dr-nav{display:flex;gap:4px}
.icb{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;font-size:13px}
.icb:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.dr-body{flex:1;min-height:0;overflow:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:18px}
.dr-src{display:flex;flex-direction:column;gap:3px}
.dr-src .l1{font:12px var(--f-mono);color:var(--ink-3)}
.dr-src .l2{font-size:14px;font-weight:500}
.dr-src .sep{color:var(--ink-3);margin:0 4px}
.dr-zh{margin:0;font:21px/1.75 var(--f-zh);word-break:break-all}
.dr-tr{margin:-8px 0 0;font-size:15px;line-height:1.6;color:var(--ink-2);max-width:62ch}
.dr-gl{margin:-10px 0 0;max-width:66ch}
.dr-gl .gl{margin:0;font-size:14.5px;line-height:1.65;color:var(--ink);word-spacing:.12em}
.sc{font-variant-caps:all-small-caps;letter-spacing:.03em}
.dr-gl .abbr{margin:3px 0 0;font-size:11.5px;line-height:1.5;color:var(--ink-3)}

.dr-sec h3{margin:0 0 10px;font:600 11px/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.dr-sec h3::after{content:"";flex:1;border-top:1px solid var(--line-soft)}
.af-grid{display:grid;grid-template-columns:minmax(108px,auto) 1fr;gap:9px 14px;align-items:start}
.af-l{font-size:12px;color:var(--ink-2);padding-top:4px;line-height:1.3}
.af-v{min-width:0;font-size:13.5px;padding-top:3px}
.af-v.ed{padding-top:0}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.opt{height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.opt:hover{border-color:var(--ink-3);color:var(--ink)}
.opt.on{background:var(--zhu);border-color:var(--zhu);color:var(--zhu-ink)}
.opt.add{width:26px;padding:0;color:var(--ink-3);border-style:dashed}
.optin{height:26px;width:130px;padding:0 8px;border-radius:13px;border:1px solid var(--zhu);background:var(--surface);font-size:12.5px;outline:none}
.lf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.lf input,.lf textarea,.lf select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px;color:var(--ink);resize:vertical}
.lf select{height:32px}
.lf textarea.zhin{font:15px/1.6 var(--f-zh)}
.lf input:focus,.lf textarea:focus{outline:none;border-color:var(--ink-2)}
.src-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.src-grid .wide{grid-column:1/-1}
details.dr-edit{border:1px solid var(--line-soft);border-radius:8px;padding:0 12px}
details.dr-edit summary{cursor:pointer;padding:9px 0;font-size:12.5px;font-weight:500;color:var(--ink-2)}
details.dr-edit[open]{padding-bottom:12px}
.nf{display:flex;flex-direction:column;gap:3px}
.nf p{margin:0;font-size:13px;line-height:1.55;white-space:pre-wrap}
.notes{display:flex;flex-direction:column;gap:12px}
.dr-foot{border-top:1px solid var(--line);padding:10px 14px 10px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.dr-foot .meta{font-size:11.5px;color:var(--ink-3);margin-right:auto;min-width:0}
.dr-foot .warn{font-size:12.5px;color:var(--zhu);margin-right:auto;font-weight:500}
.dirty-dot{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--zhu);margin-right:2px}

/* popover (columns) */
.pop{position:fixed;z-index:50;width:260px;max-width:calc(100vw - 16px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.pop-h{padding:10px 12px 6px;font-size:13px}
.pop-list{overflow:auto;padding:4px 6px;flex:1}
.pl{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;font-size:12.5px;cursor:pointer}
.pl:hover{background:var(--surface-2)}
.pl input{accent-color:var(--zhu);flex:0 0 auto}
.pop-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line-soft);background:var(--bg)}

/* bulk bar + toast */
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;max-width:calc(100vw - 24px);display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 10px 8px 14px;background:var(--ink);color:var(--surface);border-radius:10px;box-shadow:var(--shadow);font-size:12.5px}
.bulk select,.bulk input{height:28px;border-radius:5px;border:1px solid color-mix(in srgb,var(--surface) 30%,transparent);background:var(--ink);color:var(--surface);padding:0 6px;font-size:12.5px;max-width:170px}
.bulk .bb{height:28px;padding:0 10px;border-radius:5px;border:1px solid color-mix(in srgb,var(--surface) 30%,transparent);background:transparent;color:var(--surface);font-size:12.5px}
.bulk .bb:hover{background:color-mix(in srgb,var(--surface) 14%,transparent)}
.bulk .bb.zhu{background:var(--zhu);border-color:var(--zhu);color:var(--zhu-ink)}
.bulk .vs{width:1px;height:18px;background:color-mix(in srgb,var(--surface) 30%,transparent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:8px;background:var(--ink);color:var(--surface);font-size:13px;box-shadow:var(--shadow)}
.toast .linkbtn{color:var(--surface);text-decoration-color:color-mix(in srgb,var(--surface) 50%,transparent)}

/* modals */
.modal{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,#0b100e 46%,transparent)}
.sheet{width:min(860px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.sheet-h h2{margin:0;font:600 16px/1.2 var(--f-ui)}
.sheet-b{flex:1;min-height:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line-soft);background:var(--bg)}
.sheet-f .grow{margin-right:auto;font-size:12.5px;color:var(--ink-2)}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px 20px;border:1.5px dashed var(--line);border-radius:10px;text-align:center;cursor:pointer;color:var(--ink-2);font-size:13px;line-height:1.55}
.drop b{font-size:15px;color:var(--ink)}
.drop.over{border-color:var(--zhu);background:var(--zhu-soft)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop span{max-width:62ch}
.muted{color:var(--ink-3);font-size:12.5px;margin:0}
.err{color:var(--zhu);font-size:12px;margin:0}
.imp-card{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.imp-card.off{opacity:.55}
.imp-r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imp-r1 b{font-weight:600}
.imp-r2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:12px;color:var(--ink-2)}
.imp-r2 label{display:inline-flex;align-items:center;gap:6px}
.imp-r2 input,.imp-r2 select{height:28px;padding:0 7px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}

.mapwrap{overflow-x:auto}
.maptbl{border-collapse:collapse;font-size:12px;width:100%}
.maptbl td,.maptbl th{padding:5px 8px;border-top:1px solid var(--line-soft);text-align:left;vertical-align:middle}
.maptbl th{font-weight:600;color:var(--ink-3);font-size:11px}
.maptbl select{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12px}
.maptbl .ex{color:var(--ink-3);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maptbl .unk{color:var(--zhu)}
.imp-opts{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:13px;align-items:center}
.imp-opts fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.imp-opts legend{float:left;margin-right:10px;color:var(--ink-2);font-size:12.5px}
.imp-opts input{accent-color:var(--zhu)}
.plan{display:flex;flex-wrap:wrap;gap:6px 22px;padding:10px 12px;border-radius:8px;background:var(--bg);font-size:13px}
.plan b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.newvals{font-size:12.5px;line-height:1.6;padding:10px 12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c2) 45%,var(--line));background:color-mix(in srgb,var(--c2) 8%,var(--surface))}
.newvals code{font:12px var(--f-mono);background:var(--surface);border:1px solid var(--line-soft);border-radius:3px;padding:0 4px}
.prog{display:flex;flex-direction:column;gap:10px;padding:30px 4px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--zhu);transition:width .2s}
.sf{border-bottom:1px solid var(--line-soft);padding-bottom:12px;display:flex;flex-direction:column;gap:8px}
.sf-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.sf-h b{font-weight:600}
.badge{font:500 11px/18px var(--f-ui);padding:0 7px;border-radius:9px;background:var(--surface-2);color:var(--ink-2)}
.sf-h .chk{margin-left:auto}
.sf-opts{display:flex;flex-wrap:wrap;gap:5px}
.sopt{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 8px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;background:var(--surface)}
.sopt .sw{width:8px;height:8px;border-radius:2px}
.sopt .sl{border:0;background:transparent;padding:0;font:inherit;color:var(--ink)}
.sopt .sl.ed{cursor:text;text-decoration:underline dotted var(--ink-3);text-underline-offset:3px}
.sopt .sc{font:11px var(--f-mono);color:var(--ink-3)}
.sopt button.x{border:0;background:transparent;color:var(--ink-3);width:18px;height:18px;border-radius:3px}
.sopt button.x:hover{background:var(--surface-2);color:var(--zhu)}
.sf-new{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:8px;background:var(--bg)}
.sf-new input,.sf-new select{height:32px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px}
.sf-new input{flex:1 1 180px;min-width:0}

/* stats */
.stats{padding-block:16px 40px;display:flex;flex-direction:column;gap:22px;background:var(--surface)}
.st-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:12.5px;color:var(--ink-2)}
.st-ctl label{display:inline-flex;align-items:center;gap:6px}
.st-ctl select{height:28px;padding:0 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}
.st-h{margin:0 0 4px;font:600 15px/1.3 var(--f-ui)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:1200px}
table.pv{border-collapse:collapse;width:max-content;min-width:100%;font-size:12.5px}
.pv th,.pv td{padding:7px 12px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
.pv thead th{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:12px}
.pv th.rh,.pv td.rh{text-align:left;font-weight:500;color:var(--ink)}
.pv td{font:12.5px var(--f-mono);font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c1) var(--a,0%),transparent)}
.pv td.tot,.pv tr.tot td,.pv tr.tot th{font-weight:600;background:var(--bg)}
.pv td.z{color:var(--ink-3)}
.pv td.na,.pv th.na{font-style:italic;font-weight:400;color:var(--ink-3)}
.pv input{width:96px;height:26px;padding:0 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font:12px var(--f-mono);text-align:right}
.copyta{width:100%;max-width:1200px;height:120px;font:12px var(--f-mono);border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px}

@media (max-width: 860px){
  .drawer{position:fixed;inset:0;z-index:30;border:0;padding-top:env(safe-area-inset-top,0px)}
  .dr-body,.dr-head,.dr-foot{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .src-grid{grid-template-columns:1fr}
  .af-grid{grid-template-columns:1fr;gap:4px 0}
  .af-v{margin-bottom:8px}
  .search{order:3;flex-basis:100%;max-width:none}
  .actions{margin-left:0}
  .tb-r{margin-left:0}
}
@media (max-width: 640px){
  .frow{flex-direction:column;gap:2px}
  .flabel{flex-basis:auto;padding-top:0}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<body>

<div id="app">
  <header class="topbar gut">
    <div class="brand">
      <div class="seal" aria-hidden="true">DE</div>
      <div><h1>DE/DEI Corpus</h1><div class="sub">Classical Chinese DE_DEI Data Set</div></div>
    </div>
    <label class="search" id="searchBox" for="q">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search text, translation, notes, titles…  ( / )" autocomplete="off" spellcheck="false">
      <button type="button" id="rx" class="rx" aria-pressed="false" title="Search with a regular expression">.*</button>
    </label>
    <div class="actions">
      <span class="saving" id="saveState" hidden role="status">Saving to GitHub…</span>
      <label class="switch" id="annoWrap" hidden title="Edit annotations in the detail panel and in bulk"><input type="checkbox" id="anno"><span class="sw"></span><span>Annotate</span></label>
      <button type="button" class="btn" id="bImport" hidden>Import xlsx</button>
      <button type="button" class="btn primary" id="bNew" hidden>+ New entry</button>
      <div class="menu-wrap">
        <button type="button" class="btn" id="bMore" aria-haspopup="true" aria-expanded="false">More ▾</button>
        <div class="menu" id="moreMenu" hidden>
          <button type="button" data-m="schema"><span>Fields &amp; values</span><span class="k">scheme</span></button>
          <hr>
          <button type="button" data-m="exp-f"><span>Export current results</span><span class="k">.xlsx</span></button>
          <button type="button" data-m="exp-a"><span>Export all, one sheet per period</span><span class="k">.xlsx</span></button>
          <hr id="trashHr">
          <button type="button" data-m="trash"><span id="trashLabel">Trash</span><span class="k" id="trashN">0</span></button>
        </div>
      </div>
      <div class="menu-wrap" id="authWrap">
        <button type="button" class="btn" id="bAuth" aria-haspopup="true">Sign in</button>
        <div class="menu" id="authMenu" hidden></div>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="scroller" id="scroller">
      <div class="inner" id="inner">
        <section class="browse pin gut" id="browse" aria-label="Browse">
          <div class="br-head">
            <span class="eyebrow">Browse</span>
            <span class="regsel">Register
              <span class="seg2" role="group" aria-label="Register" id="regSeg">
                <button type="button" data-reg="Colloquial" aria-pressed="true">Colloquial</button>
                <button type="button" data-reg="Literary" aria-pressed="false">Literary</button>
                <button type="button" data-reg="Both" aria-pressed="false">Both</button>
              </span>
            </span>
            <span class="regsel">Dataset
              <span class="seg2" role="group" aria-label="Dataset" id="dsSeg">
                <button type="button" data-ds="Main" aria-pressed="true">Main</button>
                <button type="button" data-ds="hai/ye + DE" aria-pressed="false" title="Targeted sample of hai/ye + DE">hai/ye + DE</button>
                <button type="button" data-ds="Both" aria-pressed="false">Both</button>
              </span>
            </span>
            <span class="hint">Values in one row match any; rows combine.</span>
            <button type="button" class="linkbtn" id="resetFacets" hidden>Reset filters</button>
          </div>
          <div id="facets"></div>
        </section>

        <section class="strip pin gut" id="strip" aria-label="Diachronic distribution">
          <div class="strip-head">
            <span class="eyebrow">Diachronic distribution</span>
            <label for="stackBy">Color by <select id="stackBy"></select></label>
            <span class="seg2" role="group" aria-label="Bar height" id="scaleSeg">
              <button type="button" data-sc="share" aria-pressed="true">Share</button>
              <button type="button" data-sc="count" aria-pressed="false">Count</button>
            </span>
            <label class="chk" for="inclNA"><input type="checkbox" id="inclNA"> Include unannotated</label>
            <span class="sp"></span>
            <button type="button" class="linkbtn" id="stripToggle">Collapse</button>
          </div>
          <div class="legend" id="legend"></div>
          <div class="strip-body" id="stripBody"></div>
        </section>

        <div class="toolbar pin gut" id="toolbar">
          <div class="tabs" role="tablist">
            <button type="button" role="tab" data-v="table" aria-selected="true">Entries</button>
            <button type="button" role="tab" data-v="stats" aria-selected="false">Statistics</button>
          </div>
          <div class="chips" id="chips"></div>
          <div class="tb-r">
            <label class="chk hl-only" for="hlOnly" id="hlOnlyWrap" hidden title="Entries highlighted by collaborators"><input type="checkbox" id="hlOnly"> Show only highlighted <span class="hl-n" id="hlN"></span></label>
            <span class="count" id="count"></span>
            <button type="button" class="btn sm" id="bCols">Columns</button>
            <span class="hint">Show</span>
            <label class="chk" for="showOrig"><input type="checkbox" id="showOrig"> Original Text</label>
            <label class="chk" for="showTrans"><input type="checkbox" id="showTrans"> Translation</label>
          </div>
        </div>
        <div class="banner pin gut" id="banner" hidden></div>

        <div id="tableView"></div>
        <div id="statsView" class="stats pin gut" hidden></div>
      </div>
    </div>
    <aside class="drawer" id="drawer" hidden aria-label="Entry detail"></aside>
  </div>
</div>

<div id="pop" class="pop" hidden role="dialog"></div>
<div id="bulk" class="bulk" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<div class="modal" id="mImport" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="impTitle">
    <div class="sheet-h"><h2 id="impTitle">Import xlsx</h2><button type="button" class="icb" data-x="close" aria-label="Close">✕</button></div>
    <div class="sheet-b" id="impBody"></div>
    <div class="sheet-f" id="impFoot"></div>
  </div>
</div>

<div class="modal" id="mSchema" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="schTitle">
    <div class="sheet-h"><h2 id="schTitle">Fields &amp; values</h2><button type="button" class="icb" data-x="close" aria-label="Close">✕</button></div>
    <div class="sheet-b" id="schBody"></div>
    <div class="sheet-f"><span class="grow" id="schNote"></span><button type="button" class="btn primary" data-x="close">Done</button></div>
  </div>
</div>

<div class="modal" id="mAuth" hidden>
  <div class="sheet narrow" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="sheet-h"><h2 id="authTitle">Collaborator sign-in</h2><button type="button" class="icb" data-x="close" aria-label="Close">✕</button></div>
    <div class="sheet-b" id="authBody"></div>
    <div class="sheet-f" id="authFoot"></div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const coll=new Intl.Collator('en',{numeric:true,sensitivity:'base'});
const store={get(k,d){try{const v=localStorage.getItem('dedei.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('dedei.'+k,JSON.stringify(v));}catch(e){}}};

const DEFAULT_FIELDS=[
  {key:'period',label:'Period',type:'cat',group:'source',show:true},
  {key:'register',label:'Register',type:'cat',group:'source',options:['Colloquial','Literary'],show:false},
  {key:'dataset',label:'Dataset',type:'cat',group:'source',options:['Main','hai/ye + DE'],show:false},
  {key:'date',label:'Time',type:'short',group:'source',show:false},
  {key:'work',label:'Work Title',type:'cat',group:'source',show:true},
  {key:'section',label:'Section',type:'short',group:'source',show:true},
  {key:'text',label:'Main Text',type:'long',group:'source',show:true},
  {key:'gloss',label:'Glossing',type:'long',group:'source',show:false},
  {key:'translation',label:'Translation (Context)',type:'long',group:'source',show:false},
  {key:'use',label:'Use of DE',type:'cat',group:'anno',options:['Modal','Non-modal','Linker'],show:true},
  {key:'form',label:'Form',type:'cat',group:'anno',options:['Affirmative','Negated','Question','Only','Still','Also','Proposition','Nominal','Adjective','Verb'],show:true},

/* ---------- periods ---------- */
/* ---------- eras ----------
   Periods and dates put the era after the number ("9-10th Century CE", "480-350 BCE"),
   and BCE ranges run from the earlier (larger) number to the later one ("5-3rd Century BCE").
   Older spellings ("BCE 3-5th Century", "CE 18 Century") are accepted everywhere and rewritten. */
function ordinal(n){ const v=n%100; return n+((v>=11&&v<=13)?'th':(['th','st','nd','rd'][n%10]||'th')); }
function parseCentury(s){
  const m=String(s||'').trim().match(/^(?:(BCE|BC|CE|AD)\s*)?(\d{1,2})(?:st|nd|rd|th)?(?:\s*[-–]\s*(\d{1,2})(?:st|nd|rd|th)?)?\s*(?:centur(?:y|ies)|c\.?)?\s*(BCE|BC|CE|AD)?$/i);
  if(!m||(m[1]&&m[4])) return null;
  const era=/^b/i.test(m[1]||m[4]||'')?'BCE':'CE';
  let a=+m[2], b=m[3]?+m[3]:null;
  if(b!=null){ if((era==='BCE'&&a<b)||(era==='CE'&&a>b)){ const t=a; a=b; b=t; } if(a===b) b=null; }
  return {era,a,b};
}
function normPeriod(s){
  const t=String(s==null?'':s).trim(); if(!t||/^modern/i.test(t)) return t;
  const p=parseCentury(t); if(!p) return t;
  return (p.b!=null?p.a+'-'+ordinal(p.b):ordinal(p.a))+' Century '+p.era;
}
function normDate(s){
  const t=String(s==null?'':s).trim();
  const m=t.match(/^((?:circa|ca\.|c\.|~)\s*)?(BCE|BC|CE|AD)\s+(.+)$/i);
  if(!m) return t;
  const era=/^b/i.test(m[2])?'BCE':'CE'; let rest=m[3].trim();
  const y=rest.match(/^(\d+)\s*[-–]\s*(\d+)$/);
  if(y){ let a=+y[1], b=+y[2]; if((era==='BCE'&&a<b)||(era==='CE'&&a>b)){ const x=a; a=b; b=x; } rest=a+'-'+b; }
  else { const p=parseCentury(rest+' '+era); if(p&&/\d(st|nd|rd|th)|centur|\bc\.?$/i.test(rest)) rest=(p.b!=null?p.a+'-'+ordinal(p.b):ordinal(p.a))+(/centur/i.test(rest)?' Century':' c.'); }
  return (m[1]||'')+rest+' '+era;
}
function periodKey(p){
  const s=String(p||''); if(!s) return 1e6; if(/modern/i.test(s)) return 2100;
  const e=parseCentury(s); if(!e) return 9e5;
  return (e.era==='BCE'?-e.a*100:e.a*100)+(e.b!=null?0.5:0);
}
function periodShort(p){
  if(!p) return 'Unassigned'; const raw=String(p); if(/^modern/i.test(raw)) return 'Modern';
  const e=parseCentury(raw); if(!e) return raw;
  return (e.b!=null?e.a+'–'+e.b:e.a)+'c '+e.era;
}
function parseSheetName(n){
  const m=n.match(/\(([^)]+)\)\s*$/); let suf='',per=n.trim();
  if(m){ suf=m[1].trim(); per=n.slice(0,m.index).trim(); }
  let register='Colloquial', dataset='Main';
  if(/^lit/i.test(suf)) register='Literary';
  else if(/^coll/i.test(suf)) register='Colloquial';
  else if(/\b(hai|ye)\b/i.test(suf)) dataset='hai/ye + DE';
  else if(suf) dataset=suf;
  return {period:normPeriod(per),register,dataset};
}

/* ---------- options & colors ---------- */
const optCache=new Map(); let optVer=-1;
function optionsFor(f){
  if(!f) return [];
  if(optVer!==S.ver){ optCache.clear(); optVer=S.ver; }
  if(optCache.has(f.key)) return optCache.get(f.key).slice();
  const base=(f.options||[]).slice(); const seen=new Set(base); const extra=new Set();
  for(const r of S.rows.values()){ if(r.deleted) continue; const v=val(r,f.key); if(v&&!seen.has(v)) extra.add(v); }
  const list=base.concat([...extra].sort(coll.compare));
  if(f.key==='period') list.sort((a,b)=>periodKey(a)-periodKey(b)||coll.compare(a,b));
  optCache.set(f.key,list); return list.slice();
}
function strHash(s){ let h=0; for(let i=0;i<s.length;i++) h=(Math.imul(h,33)+s.charCodeAt(i))>>>0; return h; }
const UN_BG='repeating-linear-gradient(135deg,var(--na) 0 2px,transparent 2px 5px)';
function catColor(f,v){
  if(v==null||v==='') return UN_BG;
  if(v==='NA') return 'var(--na)';
  let i=(f&&f.options||[]).filter(o=>o!=='NA').indexOf(v); if(f&&f.key==='period') i=optionsFor(f).indexOf(v);
  if(i<0) i=(f&&f.options?f.options.length:0)+(strHash(v)%8);
  return 'var(--c'+((i%8)+1)+')';
}
function optLabel(f,v){ if(v==='') return f&&f.key==='period'?'Unassigned':'Unannotated'; return f&&f.key==='period'?periodShort(v):v; }
function normCat(f,v){
  v=String(v==null?'':v).replace(/\s+/g,' ').trim(); if(!v) return '';
  const low=v.toLowerCase(); const hit=optionsFor(f).find(o=>o.toLowerCase().replace(/\s+/g,' ')===low);
  return hit||v;
}

/* ---------- annotation formats ----------
   One function enforces the value formats on every write: saving an entry, bulk edits and imports.
   - NA is not used: NA in any annotation field becomes blank (Unannotated).
   - Form: “Negated (Verb Inversion)” → Negated + Note “Verb inversion”; “Double modal” → Affirmative + Note “Double modal”.
   - Individual Anchoring and Subject a Beneficiary take Yes / No / Unclear only. Values that carry more than
     that (e.g. “Y (pro)”, “no? (only DE)”, free-text remarks) are mapped and the original goes into Note.
   - (Modal) Argument Type takes NP / VP only; Proposition, Nominal, Adjective and Verb there are Form values and move to Form.
   - Comment / Query is folded into Note. */
const ANNO_KEYS=['use','form','force','flavor','anchoring','beneficiary','particle','argument'];
const NA_RE=/^(na|n\/a|n\.a\.?)$/i;
const FORM_MERGE={'negated (verb inversion)':['Negated','Verb inversion'],'double modal':['Affirmative','Double modal']};
const ARG_TO_FORM={proposition:'Proposition',nominal:'Nominal',adjective:'Adjective',verb:'Verb'};
function addNote(o,tag){ const cur=String(o.note==null?'':o.note).trim(); if(cur.toLowerCase().includes(tag.toLowerCase())) return; o.note=cur?cur+'; '+tag:tag; }
function ynu(v,k){
  const s=v.toLowerCase().replace(/\s+/g,' ').trim();
  if(/^(y|yes)$/.test(s)) return ['Yes',false];
  if(/^(n|no)$/.test(s)) return ['No',false];
  if(/^(\?|unclear)$/.test(s)) return ['Unclear',false];
  if(k==='anchoring'){ if(/^(y|yes)\?$/.test(s)) return ['Yes',false]; if(/^(n|no)\?$/.test(s)) return ['No',false]; }
  if(/^(y|yes)\b/.test(s)||/^(probably|likely|compatible)\b/.test(s)) return ['Yes',true];
  if(/^(n|no)\b/.test(s)||/^maybe not\b/.test(s)||/benefit to (a |the )?non-subject|not (be )?for the subject/.test(s)) return ['No',true];
  return ['Unclear',true];
}
function normalizeAnno(src){
  const o=Object.assign({},src);
  if('comment' in o){ const parts=[o.note,o.comment].map(x=>String(x==null?'':x).replace(/\r\n?/g,'\n').trim()).filter(Boolean); o.note=parts.join('; '); delete o.comment; }
  for(const k of ANNO_KEYS){ if(!(k in o)) continue; let v=String(o[k]==null?'':o[k]).replace(/\s+/g,' ').trim(); if(NA_RE.test(v)) v=''; o[k]=v; }
  const fm=o.form?FORM_MERGE[o.form.toLowerCase()]:null;
  if(fm){ o.form=fm[0]; addNote(o,fm[1]); }
  if(o.argument){
    const a=o.argument, al=a.toLowerCase();
    if(al==='np'||al==='vp') o.argument=a.toUpperCase();
    else { o.argument=''; const fv=ARG_TO_FORM[al], cf=String(o.form||'');
      if(fv&&!cf) o.form=fv; else if(!(fv&&cf.toLowerCase()===al)) addNote(o,'Argument: '+a); }
  }
  for(const k of ['anchoring','beneficiary']){
    if(!o[k]) continue; const [nv,keep]=ynu(o[k],k);
    if(keep) addNote(o,(k==='anchoring'?'Anchoring: ':'Beneficiary: ')+o[k]); o[k]=nv;
  }
  return o;
}

/* ---------- scope & filtering ---------- */
function inScope(r){
  if(S.trash?!r.deleted:r.deleted) return false;
  if(S.register!=='Both'&&regOf(r)!==S.register) return false;
  if(S.dataset!=='Both'&&dsOf(r)!==S.dataset) return false;
  return true;
}
function defaultScope(){ return S.register==='Colloquial'&&S.dataset==='Main'; }
function scopeRows(){ const out=[]; for(const r of S.rows.values()) if(inScope(r)) out.push(r); return out; }
function activeRows(){ const out=[]; for(const r of S.rows.values()) if(!r.deleted) out.push(r); return out; }
function compileGlobal(){
  const q=S.q.trim(); if(!q) return null;
  if(S.regex){ try{ return {re:new RegExp(q,'u')}; }catch(e){ return {bad:true}; } }
  return {s:q.toLowerCase()};
}
function globalKeys(){ return ['text','translation','work','section','date'].concat(S.fields.filter(f=>f.type==='long'&&!['text','translation'].includes(f.key)).map(f=>f.key)); }
function passGlobal(r,g,keys){
  if(!g||g.bad) return true;
  for(const k of keys){ const v=r[k]; if(!v) continue; const s=String(v); if(g.re?g.re.test(s):s.toLowerCase().includes(g.s)) return true; }
  return false;
}
function activeFacets(except){ return Object.entries(S.facets).filter(([k,set])=>k!==except&&set&&set.size); }
function filtered(except){
  const g=S.gq, keys=globalKeys(), fs=activeFacets(except);
  const hl=S.hlOnly&&hlVisible();
  return scopeRows().filter(r=>(!hl||r.highlight)&&passGlobal(r,g,keys)&&fs.every(([k,set])=>set.has(val(r,k))));
}
function anyFacet(){ return activeFacets(null).length>0; }
function defaultCmp(a,b){ return periodKey(a.period)-periodKey(b.period)||coll.compare(regOf(a),regOf(b))||(dsOf(a)==='Main'?0:1)-(dsOf(b)==='Main'?0:1)||(a.seq||0)-(b.seq||0)||coll.compare(a.id,b.id); }
function sortRows(list){
  const s=S.sort; if(!s){ list.sort(defaultCmp); return list; }
  const f=F(s.key); const dir=s.dir==='desc'?-1:1; let kf=null;
  if(s.key==='period') kf=r=>r.period?periodKey(r.period):1e7;
  else if(f&&f.type==='cat'){ const idx=new Map(optionsFor(f).map((v,i)=>[v,i])); kf=r=>{const v=val(r,s.key); return v?(idx.has(v)?idx.get(v):1e5):1e7;}; }
  list.sort((a,b)=>{
    let c;
    if(kf) c=kf(a)-kf(b);
    else { const av=val(a,s.key), bv=val(b,s.key); c=(!av&&bv)?1:(av&&!bv)?-1:coll.compare(av,bv); }
    return c?c*dir:defaultCmp(a,b);
  });
  return list;
}

/* ---------- highlighting ---------- */
function matchRanges(s){
  const g=S.gq; if(!g||g.bad||!s) return [];
  const out=[];
  if(g.re){
    const re=new RegExp(g.re.source,g.re.flags.includes('g')?g.re.flags:g.re.flags+'g'); let m,guard=0;
    while((m=re.exec(s))&&guard++<300){ if(!m[0].length){ re.lastIndex++; continue; } out.push([m.index,m.index+m[0].length]); }
  } else { const low=s.toLowerCase(); let i=0; while(g.s&&(i=low.indexOf(g.s,i))>=0){ out.push([i,i+g.s.length]); i+=g.s.length; } }
  return out;
}
function hl(s,de){
  s=String(s||''); const ranges=matchRanges(s); let html='',pos=0;
  const seg=(t,m)=>{ let e=esc(t); if(de) e=e.replace(/得/g,'<span class="de">得</span>'); return m?'<mark>'+e+'</mark>':e; };
  for(const [a,b] of ranges){ if(a<pos) continue; html+=seg(s.slice(pos,a),false)+seg(s.slice(a,b),true); pos=b; }
  return html+seg(s.slice(pos),false);
}

/* ---------- diachronic chart ---------- */
const LBL=14, BW=20;
function placeLabels(items,H){
  let prev=-Infinity;
  for(const it of items){ it.y=Math.max(it.c-LBL/2,prev+LBL); prev=it.y; }
  let next=Infinity;
  for(let i=items.length-1;i>=0;i--){ const it=items[i]; it.y=Math.min(it.y,next-LBL,H-LBL); next=it.y; }
  let p=-Infinity; for(const it of items){ it.y=Math.max(it.y,p+LBL,0); p=it.y; }
}
function pct(n,d){ return d?(n/d*100).toFixed(2)+'%':'—'; }
function renderStrip(){
  const strip=$('#strip'); strip.classList.toggle('closed',!S.stripOpen);
  $('#stripToggle').textContent=S.stripOpen?'Collapse':'Expand';
  const cats=S.fields.filter(f=>f.type==='cat'&&!NO_STACK.includes(f.key));
  if(!cats.some(f=>f.key===S.stackBy)) S.stackBy='use';
  const sel=$('#stackBy'); const want=cats.map(f=>'<option value="'+esc(f.key)+'"'+(f.key===S.stackBy?' selected':'')+'>'+esc(f.label)+'</option>').join('');
  if(sel.dataset.sig!==want){ sel.innerHTML=want; sel.dataset.sig=want; } sel.value=S.stackBy;
  if(!S.ready||S.offline){ $('#stripBody').innerHTML=''; $('#legend').innerHTML=''; return; }
  const f=F(S.stackBy); const base=filtered('period');
  const per=new Map(), legendVals=new Map();
  for(const r of base){ const v=val(r,f.key); if(!S.inclNA&&isNA(v)) continue; const p=val(r,'period'); if(!per.has(p)) per.set(p,new Map()); const m=per.get(p); m.set(v,(m.get(v)||0)+1); legendVals.set(v,(legendVals.get(v)||0)+1); }
  const present=new Set(scopeRows().map(r=>val(r,'period')));
  const periods=optionsFor(F('period')).filter(p=>present.has(p)); if(present.has('')) periods.push('');
  const opts=optionsFor(f).filter(v=>v!=='NA').concat(['NA','']);
  let maxDen=1, maxLab=1;
  for(const p of periods){ const m=per.get(p); if(!m) continue; let t=0; for(const c of m.values()) t+=c; if(t>maxDen) maxDen=t; if(m.size>maxLab) maxLab=m.size; }

  }).join(''):'<span class="hint">Periods appear here once entries are imported.</span>';

/* ---------- interlinear gloss ----------
   Stored as plain text. Grammatical labels are written in capitals (Leipzig rule 3) and shown as small caps;
   lexical glosses are lower-case English; “.” joins one-to-many glosses, “-” marks morpheme boundaries. */
const GLOSS_ABBR={DE:'得 (all uses)',P:'particle, function unclear',SG:'singular',PL:'plural',GEN:'genitive / subordinating 之',
  ATTR:'attributive 的/底',NMLZ:'nominalizer',TOP:'topic',SFP:'sentence-final particle',Q:'question particle',EXCL:'exclamative particle',
  PRF:'perfect, change of state (矣)',PFV:'perfective',CRS:'currently relevant state (sentence-final 了)',DUR:'durative',EXP:'experiential',
  PROG:'progressive',NEG:'negation',PROH:'prohibitive',COP:'copula',CLF:'classifier',PASS:'passive',BA:'disposal marker 把/将',
  CONJ:'conjunction 而',PROX:'proximal demonstrative',DIST:'distal demonstrative',REFL:'reflexive',OBJ:'object',VOC:'vocative',
  INTJ:'interjection',ADV:'adverbial marker 地',ADVZ:'adverbializer',HON:'honorific',HUM:'humble form',LNK:'linker',FUT:'future',
  COMP:'complementizer',DEM:'demonstrative',DIR:'directional',ASP:'aspect',PST:'past'};
const PERSON={'1':'first person','2':'second person','3':'third person'};
function glossParts(g){
  const out=[]; const re=/[123](?=\.[A-Z])|[0-9]*[A-Z][A-Z0-9]*/g; let last=0,m;
  while((m=re.exec(g))){
    const s=m.index,e=s+m[0].length,lab=m[0];
    const b=s>0?g[s-1]:'',a=e<g.length?g[e]:'';
    if(/[A-Za-z0-9]/.test(b)||/[a-z]/.test(a)||(lab.length===1&&!/[123PQ]/.test(lab))) continue;
    if(s>last) out.push({t:g.slice(last,s)}); out.push({t:lab,lab:true}); last=e;
  }
  if(last<g.length) out.push({t:g.slice(last)});
  return out;
}
function labelMeaning(l){
  if(GLOSS_ABBR[l]) return GLOSS_ABBR[l];
  const m=l.match(/^([123])(SG|PL)?$/); if(m) return PERSON[m[1]]+(m[2]?' '+GLOSS_ABBR[m[2]]:'');
  return '';
}
function glossBlock(g){
  g=String(g||'').trim(); if(!g) return '';
  const parts=glossParts(g); const used=new Map();
  const html=parts.map(p=>{ if(!p.lab) return esc(p.t); const mean=labelMeaning(p.t); if(mean&&!used.has(p.t)) used.set(p.t,mean); return '<span class="sc"'+(mean?' title="'+esc(mean)+'"':'')+'>'+esc(p.t)+'</span>'; }).join('');
  const key=[...used.entries()].map(([l,mn])=>'<b class="sc">'+esc(l)+'</b> '+esc(mn)).join(' · ');
  return '<p class="gl">'+html+'</p>'+(key?'<p class="abbr">'+key+'</p>':'');

function fmtTime(ts){ if(!ts) return ''; try{ return new Date(ts).toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }

async function fillWho(r){

}
function onDraftChange(){
  S.dirty=!same(S.draft,S.orig);

  const src=$('#drSrc'); if(src) src.innerHTML=srcLine(d);
  const zh=$('#drZh'); if(zh) zh.innerHTML=d.text?hl(d.text,true):'<span class="dim">(no main text yet)</span>';

function cleanDraft(d){
  const o={};
  for(const f of S.fields){ let v=d[f.key]==null?'':String(d[f.key]); v=f.type==='long'?v.replace(/\r\n?/g,'\n').trim():v.replace(/\s+/g,' ').trim(); if(f.type==='cat'&&v) v=normCat(f,v); o[f.key]=v; }

}
function nextSeq(period,reg){ let m=0; for(const r of S.rows.values()) if(r.period===period&&regOf(r)===reg&&(r.seq||0)>m) m=r.seq; return m+1; }
async function saveOpen(){
  if(S.saving) return false; const d=cleanDraft(S.draft);
  if(!d.text){ toast('Add the Main Text before saving'); const det=$('details.dr-edit'); if(det) det.open=true; return false; }
  const now=Date.now(), id=S.openId, who=S.myId||null;
  S.saving=true; renderFooter();
  try{
    let row;
    if(S.isNew){
      row=normalizeAnno(Object.assign({createdAt:now,createdBy:who,seq:nextSeq(d.period,d.register),key:''},d,{updatedAt:now,updatedBy:who}));
      await putRow(id,row,{msg:'Add entry'});
    } else {
      /* Only the fields changed in this panel are sent; the rest of the entry stays as it is in the repository. */
      const changed={}; for(const k of Object.keys(d)) if(!eqv(d[k],S.orig[k])) changed[k]=d[k];
      const cur=stripId(S.rows.get(id)||{});
      row=normalizeAnno(Object.assign({},cur,changed,{updatedAt:now,updatedBy:who}));
      const patch={}, base={};
      for(const k of Object.keys(row)){ if(eqv(row[k],cur[k])) continue; patch[k]=row[k]; base[k]=(k in changed)?S.orig[k]:cur[k]; }
      if(Object.keys(patch).some(k=>!META_KEYS.has(k))) await enqueue({t:'patch',id,patch,base,msg:'Edit entry'});
    }
    const nd=cleanDraft(S.rows.get(id)||row);
    S.isNew=false; S.orig=clone(nd); S.draft=clone(nd); S.dirty=false;
    await ensureOptions([row]); toast('Saved');
    return true;
  }catch(e){
    if(e&&e.code==='conflict'&&e.fields&&S.orig){
      /* Their value becomes the new starting point: saving again keeps yours, discarding keeps theirs. */
      const cur=cleanDraft(S.rows.get(id)||{}); for(const k of e.fields) if(k in S.orig) S.orig[k]=cur[k]; S.dirty=!same(S.draft,S.orig);
      const what=e.fields.map(k=>(F(k)||{label:k}).label+' to “'+(cur[k]||'Unannotated')+'”').join(', ');
      toast('Not saved: someone else changed '+what+' in the meantime. Save again to keep yours.',{label:'Keep theirs',fn:()=>{ if(S.openId!==id) return; S.draft=clone(S.orig); S.dirty=false; renderDrawer(); }});
      return false;
    }
    toastErr(e,'Not saved'); return false;
  }
  finally{ S.saving=false; renderDrawer(); markOpenRow(); schedule(); }
}

/* ---------- repository backend ----------
   The corpus lives in a GitHub repository: one JSON file per entry under data/entries/,
   field scheme and character counts under data/meta/, original xlsx uploads under imports/.
   Visitors read the published bundle (corpus.json, next to this page) and never touch the network otherwise.
   Collaborators sign in with GitHub; the page then reads the live repository and writes by committing to it.
   Every write is a commit; queued writes made within a moment of each other share one commit.
   Field-level merge: a change only conflicts when someone else changed the same field of the same entry. */
const CFG=Object.assign({owner:'m-bian',repo:'de-dei-corpus',branch:'main',appClientId:'',authRelay:'',bundle:'corpus.json',pollSeconds:60},window.DEDEI_CONFIG||{});
const API='https://api.github.com';
const REPO='/repos/'+CFG.owner+'/'+CFG.repo;
const ENTRY_DIR='data/entries/', META_DIR='data/meta/';
const META_KEYS=new Set(['createdAt','createdBy','updatedAt','updatedBy','deletedAt','deletedBy','highlight','highlightBy','highlightAt']);
const ENTRY_ORDER=DEFAULT_FIELDS.map(f=>f.key).concat(['highlight','highlightBy','highlightAt','comment','sample','seq','key','deleted','deletedAt','deletedBy','createdAt','createdBy','updatedAt','updatedBy']);
const eqv=(a,b)=>JSON.stringify(a==null?'':a)===JSON.stringify(b==null?'':b);
function stripId(row){ const o=Object.assign({},row); delete o.id; return o; }
/* In a patch, null removes the field. */
function mergePatch(base,patch){ const o=Object.assign({},base,patch); for(const k of Object.keys(patch)) if(patch[k]===null) delete o[k]; return o; }
function serEntry(row){
  const rk=k=>{ const i=ENTRY_ORDER.indexOf(k); return i<0?999:i; };
  const ks=Object.keys(row).filter(k=>k!=='id'&&row[k]!==undefined).sort((a,b)=>rk(a)-rk(b)||(a<b?-1:a>b?1:0));
  const o={}; for(const k of ks) o[k]=row[k]; return JSON.stringify(o,null,2)+'\n';
}
function b64ToText(b64){ const bin=atob(String(b64).replace(/\s/g,'')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }
function bufToB64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
async function gitBlobSha(text){
  const body=new TextEncoder().encode(text), head=new TextEncoder().encode('blob '+body.length+'\0');
  const all=new Uint8Array(head.length+body.length); all.set(head); all.set(body,head.length);
  const h=await crypto.subtle.digest('SHA-1',all); return Array.from(new Uint8Array(h),b=>b.toString(16).padStart(2,'0')).join('');
}
async function runLimited(items,n,fn){ let i=0; const errs=[]; await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{ while(i<items.length){ const it=items[i++]; try{ await fn(it); }catch(e){ errs.push(e); } } })); if(errs.length) throw errs[0]; }

/* ---- sign-in ---- */
const AUTH={token:null,refresh:null,exp:0,via:null,login:null,name:null,read:false,push:false,checked:false,problem:null};
function loadAuth(){ const a=store.get('gh',null); if(a&&a.token){ AUTH.token=a.token; AUTH.refresh=a.refresh||null; AUTH.exp=a.exp||0; AUTH.via=a.via||(a.refresh||a.exp?'app':'token'); } }
function saveAuth(){ store.set('gh',AUTH.token?{token:AUTH.token,refresh:AUTH.refresh,exp:AUTH.exp,via:AUTH.via}:null); }
function setToken(d){ AUTH.token=d.access_token; AUTH.refresh=d.refresh_token||null; AUTH.exp=d.expires_in?Date.now()+d.expires_in*1000:0; AUTH.via='app'; saveAuth(); }
class GhError extends Error{
  constructor(status,msg,extra){ super(msg||('HTTP '+status)); this.status=status; Object.assign(this,extra||{});
    if(!this.code) this.code=status===401?'auth':(status===403||status===404)?'forbidden':(status===409||status===422)?'conflict':'unavailable'; }
}
function authErr(code,msg){ return Object.assign(new Error(msg||code),{code}); }
async function relay(body){
  if(!CFG.authRelay) throw authErr('not_configured','sign-in is not configured');
  let res; try{ res=await fetch(CFG.authRelay,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }catch(e){ throw authErr('unreachable','the sign-in helper could not be reached'); }
  let d=null; try{ d=await res.json(); }catch(e){}
  if(!res.ok||!d||!d.access_token) throw authErr((d&&d.error)||('http_'+res.status),(d&&(d.error_description||d.error))||'the sign-in helper refused the request');
  return d;
}
let refreshing=null;
async function refreshToken(){
  if(!AUTH.refresh) return false;
  if(!refreshing) refreshing=relay({refresh_token:AUTH.refresh}).then(d=>{ setToken(d); return true; },()=>false).finally(()=>{ refreshing=null; });
  return refreshing;
}
async function gh(path,opt){
  opt=opt||{};
  if(AUTH.exp&&AUTH.refresh&&Date.now()>AUTH.exp-120000) await refreshToken();
  const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(AUTH.token) h.Authorization='Bearer '+AUTH.token;
  if(opt.body!==undefined) h['Content-Type']='application/json';
  let res;
  try{ res=await fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body!==undefined?JSON.stringify(opt.body):undefined,cache:'no-store'}); }
  catch(e){ throw new GhError(0,'network'); }
  if(res.status===401&&AUTH.refresh&&!opt.retried&&await refreshToken()) return gh(path,Object.assign({},opt,{retried:true}));
  if(res.status===204) return null;
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ const m=(data&&data.message)||res.statusText; throw new GhError(res.status,m,(res.status===403||res.status===429)&&/rate limit/i.test(m)?{code:'rate_limited'}:null); }
  return data;
}
/* The state value is kept in both storages: sessionStorage is the usual place, localStorage covers a return
   in another tab of the same browser (e.g. when a phone hands the GitHub page to another window). */
function startOAuth(){
  const st=Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{ sessionStorage.setItem('dedei.oauth',st); }catch(e){}
  try{ localStorage.setItem('dedei.oauth',st); }catch(e){}
  location.href='https://github.com/login/oauth/authorize?client_id='+encodeURIComponent(CFG.appClientId)+'&redirect_uri='+encodeURIComponent(location.origin+location.pathname.replace(/index\.html$/,''))+'&state='+encodeURIComponent(st);
}
function relayHost(){ try{ return new URL(CFG.authRelay).host; }catch(e){ return 'the sign-in helper'; } }
/* What a collaborator should do about each way sign-in can fail. tok: also open the token option. */
function signInHelp(code,detail){
  const owner='@'+CFG.owner;
  switch(code){
    case 'unreachable': return {tok:true,html:'This browser could not reach the sign-in helper at <code>'+esc(relayHost())+'</code>. An ad or tracker blocker, a VPN, or a university or company network filter may be blocking it (it is also blocked in mainland China). Allow it for this page and try again, or use a personal access token below.'};
    case 'bad_verification_code': return {html:'The one-time code from GitHub had expired or had already been used. Please try again.'};
    case 'forbidden': return {html:'The sign-in helper does not accept requests from <code>'+esc(location.origin)+'</code>. Please tell '+esc(owner)+' (its <code>ALLOWED_ORIGINS</code> setting needs this address).'};
    case 'not_configured': case 'incorrect_client_credentials': return {tok:true,html:'The sign-in helper is not set up correctly. Please tell '+esc(owner)+'. Meanwhile you can use a personal access token below.'};
    case 'redirect_uri_mismatch': return {html:'GitHub would not send you back to this address. Open the corpus from its usual address and try again; if it keeps happening, tell '+esc(owner)+'.'};
    case 'state': return {html:'The sign-in came back to a different tab or browser from the one it started in. Please try again in this tab.'};
    case 'bad_token': return {tok:true,html:'GitHub did not accept this token. Check that it was copied whole and has not expired.'};
    default: return {tok:true,html:'GitHub did not complete the sign-in'+(detail?' (“'+esc(detail)+'”)':'')+'. Please try again. If it fails again, use a personal access token below and tell '+esc(owner)+'.'};
  }
}
function signInProblem(code,detail){ const h=signInHelp(code,detail); openAuth({html:h.html,code,tok:!!h.tok}); }
async function finishOAuth(){
  const u=new URL(location.href); const code=u.searchParams.get('code'), st=u.searchParams.get('state'), err=u.searchParams.get('error'), desc=u.searchParams.get('error_description');
  if(!code&&!err) return;
  ['code','state','error','error_description','error_uri','installation_id','setup_action'].forEach(k=>u.searchParams.delete(k));
  history.replaceState(null,'',u.pathname+(u.search||'')+u.hash);
  let want=null;
  try{ want=sessionStorage.getItem('dedei.oauth'); sessionStorage.removeItem('dedei.oauth'); }catch(e){}
  try{ want=want||localStorage.getItem('dedei.oauth'); localStorage.removeItem('dedei.oauth'); }catch(e){}
  if(err){ if(err==='access_denied') toast('Sign-in was cancelled'); else signInProblem(err,desc); return; }
  if(!want||want!==st){ signInProblem('state'); return; }
  try{ setToken(await relay({code})); }catch(e){ console.warn('Sign-in failed',e.code,e.message); signInProblem(e.code,e.message); }
}
async function checkAccess(){
  AUTH.login=null; AUTH.name=null; AUTH.read=false; AUTH.push=false; AUTH.problem=null;
  if(AUTH.token){
    try{ const u=await gh('/user'); AUTH.login=u.login; AUTH.name=u.name||u.login; }

      else AUTH.problem='offline';
      AUTH.checked=true; return;
    }
    try{ const r=await gh(REPO); AUTH.read=true; const p=r.permissions; AUTH.push=p?!!(p.push||p.maintain||p.admin):true; }
    catch(e){ AUTH.problem=(e.status===403||e.status===404)?'no-repo':'offline'; }
  }

}
/* After checking access: explain anything that keeps a signed-in person from editing. */
function explainAccess(again){

function signOut(quiet){

/* ---- reading ---- */
S.remote=new Map(); S.blob=new Map(); S.pend=new Map(); S.metaRemote={}; S.headSha=null; S.treeSha=null;
function displayRow(id){
  let r=S.remote.has(id)?Object.assign({},S.remote.get(id),{id}):null;
  const ps=S.pend.get(id); if(ps) for(const op of ps){ if(op.t==='del') r=null; else if(op.t==='put') r=Object.assign({},op.row,{id}); else if(op.t==='patch') r=Object.assign(mergePatch(r||{},op.patch),{id}); }
  return r;
}
function refreshRow(id){ const r=displayRow(id); if(r) S.rows.set(id,r); else S.rows.delete(id); }
function applyMeta(name,d){
  S.metaRemote[name]=d||null;
  if(name==='schema'){ if(d&&Array.isArray(d.fields)&&d.fields.length){ S.fields=mergeSchema(clone(d.fields)); if(!$('#mSchema').hidden) renderSchema(); } }
  else if(name==='sources') S.sources=Object.assign({},d&&d.chars||{});
}
function applyFile(p,d){
  if(p.startsWith(ENTRY_DIR)){ const id=p.slice(ENTRY_DIR.length,-5); if(d) S.remote.set(id,d); else S.remote.delete(id); refreshRow(id); }
  else if(p===META_DIR+'schema.json') applyMeta('schema',d);
  else if(p===META_DIR+'sources.json') applyMeta('sources',d);
}
const tracked=p=>(p.startsWith(ENTRY_DIR)&&p.endsWith('.json')&&p.indexOf('/',ENTRY_DIR.length)<0)||p===META_DIR+'schema.json'||p===META_DIR+'sources.json';
async function loadBundle(){
  const res=await fetch(CFG.bundle,{cache:'no-cache'}); if(!res.ok) throw new Error('bundle '+res.status);
  const b=await res.json();
  for(const [id,row] of Object.entries(b.entries||{})) S.remote.set(id,row);
  for(const [p,sha] of Object.entries(b.blobs||{})) S.blob.set(p,sha);
  const m=b.meta||{}; applyMeta('schema',m.schema); applyMeta('sources',m.sources);
  /* The snapshot leaves out the trash, so a signed-in collaborator always compares it with the live repository once. */
  S.bundleCommit=b.commit||null; S.builtAt=b.builtAt||0;
  S.rows=new Map(); for(const id of S.remote.keys()) refreshRow(id); bump();
}
let syncing=null;
function syncRepo(){ if(!syncing) syncing=doSync().finally(()=>{ syncing=null; }); return syncing; }
async function doSync(){
  const ref=await gh(REPO+'/git/ref/heads/'+encodeURIComponent(CFG.branch));
  const head=ref.object.sha; if(head===S.headSha&&S.treeSha) return 0;
  const c=await gh(REPO+'/git/commits/'+head);
  const t=await gh(REPO+'/git/trees/'+c.tree.sha+'?recursive=1');
  const want=new Map(); for(const e of t.tree) if(e.type==='blob'&&tracked(e.path)) want.set(e.path,e.sha);
  const changed=[...want].filter(([p,s])=>S.blob.get(p)!==s), removed=[...S.blob.keys()].filter(p=>!want.has(p));
  if(changed.length>40&&!S.ready){ S.loadNote='Loading '+changed.length+' entries from GitHub…'; schedule(); }
  const texts=new Map();
  await runLimited(changed,8,async([p,s])=>{ const b=await gh(REPO+'/git/blobs/'+s); texts.set(p,b.encoding==='base64'?b64ToText(b.content):b.content); });
  for(const [p,s] of changed){ let d=null; try{ d=JSON.parse(texts.get(p)); }catch(e){ console.warn('Skipping a file that is not valid JSON:',p); } if(d) applyFile(p,d); S.blob.set(p,s); }
  for(const p of removed){ applyFile(p,null); S.blob.delete(p); }
  S.headSha=head; S.treeSha=c.tree.sha; bump(); schedule();
  return changed.length+removed.length;
}
function startPolling(){
  stopPolling();
  S.pollT=setInterval(()=>{ if(document.visibilityState==='visible'&&AUTH.read&&!Q.running) syncRepo().catch(()=>{}); },Math.max(20,+CFG.pollSeconds||60)*1000);
}
function stopPolling(){ if(S.pollT){ clearInterval(S.pollT); S.pollT=0; } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&AUTH.read&&S.pollT&&!Q.running) syncRepo().catch(()=>{}); });

/* ---- writing ---- */
const Q={list:[],timer:0,running:false};
function enqueue(op){
  return new Promise((res,rej)=>{
    if(!S.writable){ rej(new GhError(403,'read-only')); return; }
    op.res=res; op.rej=rej; Q.list.push(op); renderSaving();
    if(op.id){ if(!S.pend.has(op.id)) S.pend.set(op.id,[]); S.pend.get(op.id).push(op); refreshRow(op.id); bump(); schedule(); }
    if(!Q.timer&&!Q.running) Q.timer=setTimeout(drain,40);
  });
}
async function drain(){
  Q.timer=0; if(Q.running) return; Q.running=true; renderSaving();
  try{ while(Q.list.length){ const batch=Q.list.splice(0,800); try{ await commitBatch(batch); }catch(e){ for(const op of batch) if(!op.done) settle(op,e); } } }
  finally{ Q.running=false; renderSaving(); if(Q.list.length&&!Q.timer) Q.timer=setTimeout(drain,40); }
}
function settle(op,err){
  if(op.done) return; op.done=true;
  if(op.id){ const ps=S.pend.get(op.id); if(ps){ const i=ps.indexOf(op); if(i>=0) ps.splice(i,1); if(!ps.length) S.pend.delete(op.id); } refreshRow(op.id); }
  if(err) op.rej(err); else op.res(); bump(); schedule();
}
function commitMessage(ops){
  const by=new Map();
  for(const o of ops){ const m=o.msg||(o.t==='meta'?'Update '+o.name:o.t==='file'?'Upload '+o.path:'Edit entries'); if(!by.has(m)) by.set(m,[]); if(o.id&&!by.get(m).includes(o.id)) by.get(m).push(o.id); }
  const lines=[...by].map(([m,ids])=>ids.length?m+' ('+(ids.length<=5?ids.join(', '):ids.length+' entries')+')':m);
  const first=lines.length>1?lines[0]+' and '+(lines.length-1)+' more change'+(lines.length>2?'s':''):lines[0];
  return first+(lines.length>1?'\n\n'+lines.map(l=>'- '+l).join('\n'):'')+'\n\nMade in the DE/DEI Corpus web editor';
}
async function commitBatch(ops){
  for(let attempt=0;;attempt++){
    await syncRepo();
    const next=new Map(), metaNext={}, files=[], bad=[], good=[];
    const cur=id=>next.has(id)?next.get(id):(S.remote.has(id)?S.remote.get(id):null);
    for(const op of ops){
      if(op.t==='put'){ if(op.create&&cur(op.id)){ bad.push([op,new GhError(409,'exists',{code:'conflict'})]); continue; } next.set(op.id,stripId(op.row)); good.push(op); }
      else if(op.t==='patch'){
        const c=cur(op.id); if(!c){ bad.push([op,new GhError(404,'gone',{code:'gone'})]); continue; }
        const clash=Object.keys(op.patch).filter(k=>!META_KEYS.has(k)&&op.base&&(k in op.base)&&!eqv(c[k],op.base[k])&&!eqv(c[k],op.patch[k]));
        if(clash.length){ bad.push([op,new GhError(409,'conflict',{code:'conflict',fields:clash,id:op.id})]); continue; }
        next.set(op.id,mergePatch(c,op.patch)); good.push(op);
      }
      else if(op.t==='del'){ next.set(op.id,null); good.push(op); }
      else if(op.t==='meta'){ metaNext[op.name]=op.data; good.push(op); }
      else if(op.t==='file'){ files.push(op); good.push(op); }
    }
    const tree=[], shaOf=new Map();
    for(const [id,row] of next){ const p=ENTRY_DIR+id+'.json';
      if(row===null){ if(S.blob.has(p)) tree.push({path:p,mode:'100644',type:'blob',sha:null}); continue; }
      const txt=serEntry(row), sha=await gitBlobSha(txt); if(S.blob.get(p)===sha) continue;
      tree.push({path:p,mode:'100644',type:'blob',content:txt}); shaOf.set(p,sha); }
    for(const [name,data] of Object.entries(metaNext)){ const p=META_DIR+name+'.json'; const txt=JSON.stringify(data,null,2)+'\n', sha=await gitBlobSha(txt); if(S.blob.get(p)===sha) continue; tree.push({path:p,mode:'100644',type:'blob',content:txt}); shaOf.set(p,sha); }
    for(const op of files){ if(!op.sha) op.sha=(await gh(REPO+'/git/blobs',{method:'POST',body:{content:op.b64,encoding:'base64'}})).sha; tree.push({path:op.path,mode:'100644',type:'blob',sha:op.sha}); }
    if(tree.length){
      const nt=await gh(REPO+'/git/trees',{method:'POST',body:{base_tree:S.treeSha,tree}});
      const nc=await gh(REPO+'/git/commits',{method:'POST',body:{message:commitMessage(good),tree:nt.sha,parents:[S.headSha]}});
      try{ await gh(REPO+'/git/refs/heads/'+encodeURIComponent(CFG.branch),{method:'PATCH',body:{sha:nc.sha,force:false}}); }
      catch(e){ if((e.status===422||e.status===409)&&attempt<5){ await sleep(250+Math.random()*750*(attempt+1)); continue; } throw e; }
      S.headSha=nc.sha; S.treeSha=nt.sha;
    }
    for(const [id,row] of next){ const p=ENTRY_DIR+id+'.json'; if(row===null){ S.remote.delete(id); S.blob.delete(p); } else { S.remote.set(id,row); if(shaOf.has(p)) S.blob.set(p,shaOf.get(p)); } }
    for(const [name,data] of Object.entries(metaNext)){ const p=META_DIR+name+'.json'; S.metaRemote[name]=data; if(shaOf.has(p)) S.blob.set(p,shaOf.get(p)); }
    for(const op of good) settle(op); for(const [op,e] of bad) settle(op,e);
    return;
  }
}

/* ---- the write operations the rest of the page uses ---- */
function putRow(id,row,opt){
  opt=opt||{};
  if(!S.remote.has(id)&&!(S.pend.get(id)||[]).length) return enqueue({t:'put',id,row:stripId(row),create:true,msg:opt.msg||'Add entry'});
  const cur=S.rows.get(id)||{}; const patch={}, base={};
  for(const k of Object.keys(row)){ if(k==='id'||eqv(row[k],cur[k])) continue; patch[k]=row[k]; base[k]=cur[k]; }
  return Object.keys(patch).length?enqueue({t:'patch',id,patch,base,msg:opt.msg||'Edit entry'}):Promise.resolve();
}
function patchRow(id,patch,msg){ const cur=S.rows.get(id)||{}; const base={}; for(const k of Object.keys(patch)) base[k]=cur[k]; return enqueue({t:'patch',id,patch:clone(patch),base,msg}); }
async function runPool(items,worker,conc,onProg){
  /* All writes are queued at once so that they share as few commits as possible. */
  let done=0; const errs=[];
  await Promise.all(items.map(async it=>{ try{ await worker(it); }catch(e){ errs.push(e); } done++; if(onProg) onProg(done,items.length); }));
  return errs;
}
async function saveSchema(){ await enqueue({t:'meta',name:'schema',data:{fields:clone(S.fields),updatedAt:Date.now()},msg:'Edit the field scheme'}); }
async function ensureOptions(rows){
  let changed=false;
  for(const f of S.fields){
    if(f.type!=='cat'||f.key==='work'||f.key==='period') continue;
    for(const r of rows){ const v=r[f.key]; if(v&&!(f.options||[]).includes(v)){ f.options=(f.options||[]).concat([v]); changed=true; } }
  }
  if(changed){ bump(); try{ await saveSchema(); }catch(e){} }
}

function colLetter(c){ let s=''; c++; while(c>0){ const m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26); } return s; }
function normHeader(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function matchField(label){
  const n=normHeader(label);
  for(const [k,al] of Object.entries(ALIASES)) if(al.includes(n)&&F(k)) return k;
  const f=S.fields.find(f=>normHeader(f.label)===n||f.key===n); return f?f.key:null;

function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40)||'field'; }
const IMP={};
