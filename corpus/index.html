/* A sheet may hold several tables, each starting with its own header row (a row with a “Main Text” cell).
   Columns are matched by header label across all tables of the sheet; unlabeled columns by position. */
function analyzeSheet(name,ws,X){
  const aoa=X.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:false});
  const meta=parseSheetName(name);
  const sh={name,aoa,blocks:[],include:false,period:meta.period,register:meta.register,dataset:meta.dataset,map:[],open:false};
  const isHdr=row=>(row||[]).some(c=>/^\s*main\s*text\s*$/i.test(String(c)));
  for(let i=0;i<aoa.length;i++) if(isHdr(aoa[i])) sh.blocks.push({h:i,end:aoa.length,cols:[]});
  for(let b=0;b+1<sh.blocks.length;b++) sh.blocks[b].end=sh.blocks[b+1].h;
  if(!sh.blocks.length) return sh;
  sh.include=true;
  const byKey=new Map();
  for(const bl of sh.blocks){
    const hdr=aoa[bl.h]; let width=hdr.length; for(let i=bl.h+1;i<bl.end;i++) width=Math.max(width,(aoa[i]||[]).length);
    for(let c=0;c<width;c++){
      const label=String(hdr[c]==null?'':hdr[c]).trim(); let ex='',hasData=false;
      for(let i=bl.h+1;i<bl.end;i++){ const v=String((aoa[i]||[])[c]==null?'':(aoa[i]||[])[c]).trim(); if(v){ hasData=true; ex=v; break; } }
      if(!label&&!hasData) continue;
      const lk=label?'L:'+normHeader(label):'C:'+c;
      bl.cols.push({c,lk});
      let m=byKey.get(lk);
      if(!m){ m={lk,label,c,hasData,ex,target:'__ignore',known:false}; byKey.set(lk,m); sh.map.push(m); }
      else if(!m.hasData&&hasData){ m.hasData=true; m.ex=ex; }
    }
  }
  const used=new Set();
  // Several columns may feed Note (e.g. “Note” and “Comment / Query”); their texts are joined.
  for(const m of sh.map){ if(!m.label) continue; const k=matchField(m.label); if(k&&(!used.has(k)||k==='note')){ m.target=k; m.known=true; used.add(k); } }
  let blankToNote=false;
  for(const m of sh.map) if(!m.label&&m.hasData&&!blankToNote){ m.target='note'; blankToNote=true; }
  return sh;
}
function sheetRows(sh){
  const tm=new Map(sh.map.map(m=>[m.lk,m.target])); let n=0;
  for(const bl of sh.blocks){ const tc=bl.cols.find(x=>tm.get(x.lk)==='text'); if(!tc) continue; for(let i=bl.h+1;i<bl.end;i++) if(String((sh.aoa[i]||[])[tc.c]||'').trim()) n++; }
  return n;
}
function newKeyFor(m){ return 'x_'+slug(m.label||('col_'+colLetter(m.c))); }
function planImport(){
  const existing=new Map();
  for(const r of S.rows.values()){ if(IMP.dropSamples&&r.sample) continue; if(r.key) existing.set(r.key,r); }
  const creates=[],updates=[]; let skips=0,unchanged=0; const newVals={}; const occ=new Map();
  for(const sh of IMP.sheets){
    if(!sh.include||!sh.blocks.length) continue;
    const tm=new Map(sh.map.map(m=>[m.lk,m])); let seq=0;
    for(const bl of sh.blocks){
      const tc=bl.cols.find(x=>tm.get(x.lk).target==='text'); if(!tc) continue;
      for(let i=bl.h+1;i<bl.end;i++){
        const cells=sh.aoa[i]||[]; const text=String(cells[tc.c]==null?'':cells[tc.c]).replace(/\r\n?/g,'\n').trim(); if(!text) continue;
        let row={period:String(sh.period||'').trim(),register:String(sh.register||'').trim()||'Colloquial',dataset:String(sh.dataset||'').trim()||'Main'};
        for(const col of bl.cols){
          const m=tm.get(col.lk); if(m.target==='__ignore'||m.target==='text') continue;
          const key=m.target==='__new'?newKeyFor(m):m.target; const f=F(key);
          let v=String(cells[col.c]==null?'':cells[col.c]).replace(/\r\n?/g,'\n').trim();
          if(f&&f.type==='cat') v=normCat(f,v);
          if((key==='period'||key==='register')&&!v) continue;
          if(key==='note'&&row.note){ if(v&&!row.note.includes(v)) row.note+='; '+v; continue; }
          if(!v&&row[key]) continue;
          row[key]=v;
        }
        row=normalizeAnno(row);
        for(const f of S.fields){ if(f.type!=='cat'||f.key==='work'||f.key==='period') continue; const v=row[f.key]; if(v&&!optionsFor(f).includes(v)) (newVals[f.key]=newVals[f.key]||new Set()).add(v); }
        row.text=text; row.seq=++seq; row.period=normPeriod(row.period); if(row.date) row.date=normDate(row.date);
        const base=row.period+'|'+(row.work||'')+'|'+(row.section||'')+'|'+text.replace(/\s+/g,'');
        const n=(occ.get(base)||0)+1; occ.set(base,n); row.key=base+'#'+n;
        const ex=existing.get(row.key);
        if(!ex) creates.push(row);
        else if(IMP.dup==='skip') skips++;
        else { const patch={}; for(const [k,v] of Object.entries(row)){ if(k==='seq'||k==='key') continue; if(val(ex,k)!==v) patch[k]=v; } if(ex.deleted) patch.deleted=false; if(Object.keys(patch).length) updates.push({id:ex.id,patch}); else unchanged++; }
      }
    }
  }
  IMP.plan={creates,updates,skips,unchanged,newVals};
}
function sampleCount(){ let n=0; for(const r of S.rows.values()) if(r.sample&&!r.deleted) n++; return n; }
function renderImport(){
  const bodyEl=$('#impBody'), foot=$('#impFoot');
  if(IMP.busy){ bodyEl.innerHTML='<div class="prog"><div id="progT">Writing to the corpus…</div><div class="bar"><i id="progB"></i></div><p class="muted">Keep this page open until the import finishes.</p></div>'; foot.innerHTML=''; return; }

async function readWorkbook(file){
  IMP.err=''; $('#impBody').innerHTML='<div class="prog"><div>Reading '+esc(file.name)+'…</div></div>';
  try{
    const X=await loadXLSX(); const buf=await file.arrayBuffer(); const wb=X.read(buf,{type:'array'});
    IMP.file=file; IMP.fileName=file.name; IMP.sheets=wb.SheetNames.map(n=>analyzeSheet(n,wb.Sheets[n],X));
    if(!IMP.sheets.some(s=>s.blocks.length)){ IMP.sheets=[]; IMP.err='No sheet has a “Main Text” header. Check that the header row includes a Main Text column.'; }
  }catch(e){ IMP.sheets=[]; IMP.err=e&&e.message==='load'?'The spreadsheet reader could not load. Check your connection and try again.':'This file could not be read. Make sure it is a valid Excel workbook.'; }
  renderImport();
}
function importPath(name){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const safe=String(name||'upload.xlsx').replace(/[\\/:*?"<>|\u0000-\u001f]+/g,'_').replace(/^\.+/,'').slice(0,120)||'upload.xlsx';
  return 'imports/'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+'_'+safe;
}
async function commitImport(){
  planImport(); const p=IMP.plan; IMP.busy=true; IMP.savedPath=''; renderImport();
  const newFields=[];
  for(const sh of IMP.sheets){ if(!sh.include||!sh.blocks.length) continue; for(const m of sh.map){ if(m.target!=='__new') continue; const key=newKeyFor(m); if(F(key)||newFields.some(f=>f.key===key)) continue;
    const vals=new Set(); for(const bl of sh.blocks){ const col=bl.cols.find(x=>x.lk===m.lk); if(!col) continue; for(let i=bl.h+1;i<bl.end;i++){ const v=String((sh.aoa[i]||[])[col.c]||'').trim(); if(v) vals.add(v); } }
    const cat=vals.size<=24; newFields.push(cat?{key,label:m.label||'Column '+colLetter(m.c),type:'cat',group:'anno',options:[...vals],show:true}:{key,label:m.label||'Column '+colLetter(m.c),type:'long',group:'notes',show:true}); } }
  let schemaChanged=newFields.length>0;
  for(const [k,set] of Object.entries(p.newVals)){ const f=F(k); if(!f) continue; const add=[...set].filter(v=>!(f.options||[]).includes(v)); if(add.length){ f.options=(f.options||[]).concat(add); schemaChanged=true; } }
  if(newFields.length) S.fields=S.fields.concat(newFields);
  if(schemaChanged){ bump(); try{ await saveSchema(); }catch(e){} }
  const now=Date.now(), who=S.myId||null; const jobs=[]; const msg='Import '+(IMP.fileName||'xlsx');
  if(IMP.file){ try{ jobs.push({t:'file',path:importPath(IMP.fileName),b64:bufToB64(await IMP.file.arrayBuffer())}); }catch(e){} }
  for(const row of p.creates) jobs.push({t:'set',id:genId(),row:Object.assign({},row,{createdAt:now,createdBy:who,updatedAt:now,updatedBy:who})});
  for(const u of p.updates) jobs.push({t:'upd',id:u.id,patch:Object.assign({},u.patch,{updatedAt:now,updatedBy:who})});
  let trashed=0;
  if(IMP.dropSamples) for(const r of S.rows.values()) if(r.sample&&!r.deleted){ trashed++; jobs.push({t:'upd',id:r.id,patch:{deleted:true,deletedAt:now,deletedBy:who},msg:'Move sample entries to trash'}); }
  let last=0;
  const tt0=$('#progT'); if(tt0) tt0.textContent='Saving '+jobs.length+' changes to GitHub…';
  const errs=await runPool(jobs,j=>j.t==='file'?enqueue({t:'file',path:j.path,b64:j.b64,msg}).then(()=>{ IMP.savedPath=j.path; }):j.t==='set'?putRow(j.id,j.row,{msg}):patchRow(j.id,j.patch,j.msg||msg),4,(d,n)=>{ const t=performance.now(); if(t-last<120&&d<n) return; last=t; const b=$('#progB'), tt=$('#progT'); if(b) b.style.width=(d/n*100).toFixed(1)+'%'; if(tt) tt.textContent='Writing to the corpus… '+d+' / '+n; });
  IMP.busy=false; IMP.done={created:p.creates.length,updated:p.updates.length,skipped:p.skips+p.unchanged,trashed,errors:errs.length,quota:false,err:errs[0]||null};
  renderImport(); schedule();
}

async function exportXlsx(mode){
  if(!S.downloads){ toast('Downloads are not available in this view'); return; }
  let X; try{ X=await loadXLSX(); }catch(e){ toast('The spreadsheet writer could not load'); return; }
  const wb=X.utils.book_new(); const today=new Date().toISOString().slice(0,10);
  if(mode==='filtered'){
    const rows=sortRows(filtered(null)); const cols=S.fields;
    X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([cols.map(f=>f.label)].concat(rows.map(r=>cols.map(f=>f.key==='register'?regOf(r):f.key==='dataset'?dsOf(r):(r[f.key]==null?'':r[f.key]))))),'DE_DEI');
  } else {
    const rows=activeRows().sort(defaultCmp); const cols=S.fields.filter(f=>f.key!=='period'&&!SCOPE_KEYS.includes(f.key));
    const groups=new Map(); for(const r of rows){ const ds=dsOf(r); const k=(r.period||'Unassigned')+' ('+(ds!=='Main'?(DS_SHEET[ds]||ds):regOf(r))+')'; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r); }
    const used=new Set();
    for(const [k,list] of groups){ let n=k.replace(/[\[\]:*?\/\\]/g,'-').slice(0,31); let j=2; while(used.has(n)){ n=n.slice(0,28)+' '+(j++); } used.add(n);
      X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([cols.map(f=>f.label)].concat(list.map(r=>cols.map(f=>r[f.key]==null?'':r[f.key])))),n); }
  }
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});
  try{ await S.downloads.save({filename:'DE_DEI_'+(mode==='filtered'?'results':'all')+'_'+today+'.xlsx',data:new Blob([buf])}); }
  catch(e){ if(e&&e.code==='declined') return; toast(e&&e.code==='rate_limited'?'A download is already waiting for confirmation':'Export failed, try again shortly'); }
}

function workPeriods(){ const m=new Map(); for(const r of activeRows()){ if(!r.work) continue; if(!m.has(r.work)) m.set(r.work,new Map()); const c=m.get(r.work); const p=val(r,'period'); c.set(p,(c.get(p)||0)+1); } const out=new Map(); for(const [w,c] of m){ let best='',bn=-1; for(const [p,n] of c) if(n>bn){ best=p; bn=n; } out.set(w,best); } return out; }

  let sumC=0,sumN=0;

  h+='<div><h2 class="st-h">Corpus size</h2><p class="muted">Character counts exclude punctuation and drive the per-10k-character rates. Figures entered so far come from the Summary sheet'+(S.writable?' and can be edited here.':'.')+' Counts cover the Main dataset in both registers, excluding trash.</p></div><div class="tblwrap"><table class="pv"><thead><tr><th class="rh">Work Title</th><th class="rh">Period</th><th>Entries</th><th>Characters</th><th>Entries per 10k chars</th></tr></thead><tbody>'+(rows||'<tr><td class="rh" colspan="5">No data yet</td></tr>')+'</tbody><tfoot><tr class="tot"><th class="rh">Total</th><td></td><td>'+sumN+'</td><td>'+(sumC||'—')+'</td><td></td></tr></tfoot></table></div>';
  const ae=document.activeElement; const keep=ae&&ae.dataset&&ae.dataset.src;
  sv.innerHTML=h;
  if(keep){ const n=sv.querySelector('input[data-src="'+CSS.escape(keep)+'"]'); if(n) n.focus(); }
}
async function saveSource(w,v){
  const n=Math.max(0,Math.round(+v||0)); if(n) S.sources[w]=n; else delete S.sources[w];
  bump(); schedule();
  try{ await enqueue({t:'meta',name:'sources',data:{chars:Object.assign({},S.sources),updatedAt:Date.now()},msg:'Update the character count of '+w}); }catch(e){ toastErr(e,'Character count not saved'); }
}

  sb.addEventListener('click',async e=>{

      inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); fin(true); } else if(ev.key==='Escape'){ ev.stopPropagation(); fin(false); } }); inp.addEventListener('blur',()=>fin(true)); return; }
    const del=e.target.closest('[data-delopt]');
    if(del){ const f=F(del.dataset.delopt); f.options=(f.options||[]).filter(v=>v!==del.dataset.v); bump(); renderSchema(); schedule(); try{ await saveSchema(); }catch(err){ toastErr(err,'Not saved'); } return; }
    const add=e.target.closest('[data-addopt]');

function clearChip(id){
  if(id==='all'){ S.facets={}; S.q=''; $('#q').value=''; S.sort=null; S.trash=false; S.hlOnly=false; S.register='Colloquial'; S.dataset='Main'; }
  else if(id==='hl') S.hlOnly=false;
  else if(id==='q'){ S.q=''; $('#q').value=''; }
  else if(id==='sort') S.sort=null;
  else if(id==='reg') S.register='Colloquial';
  else if(id==='ds') S.dataset='Main';
  else if(id==='trash'){ S.trash=false; S.selected.clear(); }
  else if(id.startsWith('f:')) delete S.facets[id.slice(2)];
  S.renderLimit=150; closePop(); schedule();
}
function bindLayout(){
  const sc=$('#scroller'), inner=$('#inner'), tb=$('#toolbar');
  const upd=()=>{ inner.style.setProperty('--sw',sc.clientWidth+'px'); inner.style.setProperty('--tbh',tb.offsetHeight+'px'); };
  if('ResizeObserver' in window){ const ro=new ResizeObserver(upd); ro.observe(sc); ro.observe(tb); }
  addEventListener('resize',upd); upd();
}

/* ---------- boot ---------- */
function mergeSchema(fields){
  const out=fields.filter(f=>f&&f.key&&f.label&&f.type&&f.key!=='comment');
  for(const f of out){
    const d=DEFAULT_FIELDS.find(x=>x.key===f.key); if(!d) continue;
    if(LEGACY_LABELS[f.key]&&LEGACY_LABELS[f.key].includes(f.label)) f.label=d.label;
    if(LEGACY_DROP[f.key]&&Array.isArray(f.options)){ const drop=new Set(LEGACY_DROP[f.key]); f.options=d.options.concat(f.options.filter(v=>!drop.has(v)&&!d.options.includes(v))); }
  }
  for(const d of DEFAULT_FIELDS) if(!out.some(f=>f.key===d.key)) out.push(clone(d));
  return out;
}
async function boot(){
  bind(); bindLayout(); render();
  S.downloads={save:saveBlob};
  loadAuth(); renderAuth();
  const oauth=finishOAuth();
  let bundled=false;
  try{ await loadBundle(); bundled=true; S.ready=true; render(); }catch(e){ console.warn('Bundle not loaded',e); }
  await oauth;
  if(AUTH.token){ await checkAccess(); renderAuth(); render(); explainAccess(); }
  if(AUTH.read){
    try{ await syncRepo(); }catch(e){ if(!bundled) toast('GitHub could not be reached; reload to try again'); }
    startPolling();
  }
  if(!bundled&&!S.rows.size) S.offline=true;
  S.ready=true; S.loadNote=''; renderAuth(); render();
}
boot();
})();
